<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1c2d"/>
      <stop offset="100%" stop-color="#051424"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#carbonGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#30363d" stroke-width="4"/>

  <!-- Subtle In-Cab HUD Grid Lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1c2b3c" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#1c2b3c" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#162536" stroke-width="2"/>

  <!-- Outer Shield Emblem -->
  <path d="M256 70 L390 130 C390 270, 330 380, 256 426 C182 380, 122 270, 122 130 Z" 
        fill="#08182b" stroke="url(#amberGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Amber Core Shield -->
  <path d="M256 100 L366 150 C366 260, 316 350, 256 392 C196 350, 146 260, 146 150 Z" 
        fill="#0b2138" stroke="#f59e0b" stroke-width="3" opacity="0.9"/>

  <!-- Mechanical Heavy Shackle / Lock Symbol -->
  <!-- Shackle Arch -->
  <path d="M206 200 V168 C206 140, 226 122, 256 122 C286 122, 306 140, 306 168 V200" 
        fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="186" y="196" width="140" height="110" rx="18" fill="url(#amberGrad)"/>
  
  <!-- Lock Keyhole / Relay Core -->
  <circle cx="256" cy="240" r="14" fill="#051424"/>
  <polygon points="250,240 262,240 266,274 246,274" fill="#051424"/>

  <!-- Telemetry Pulse Wave / Safety Status -->
  <polyline points="130,330 190,330 215,295 240,365 270,305 295,340 320,330 382,330" 
            fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Industrial Bolt Corners -->
  <circle cx="48" cy="48" r="8" fill="#30363d"/>
  <circle cx="464" cy="48" r="8" fill="#30363d"/>
  <circle cx="48" cy="464" r="8" fill="#30363d"/>
  <circle cx="464" cy="464" r="8" fill="#30363d"/>

  <!-- Typography Monogram -->
  <text x="256" y="475" text-anchor="middle" font-family="monospace" font-size="28" font-weight="800" fill="#f59e0b" letter-spacing="4">DRIVELOCK</text>
</svg>
